[package]
name = "muehlenstein-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[workspace]
members = ["vendor/Sanmill/crates/tgf-core", "vendor/Sanmill/crates/tgf-mill", "vendor/Sanmill/crates/tgf-search"]

[dependencies]
tgf-core = { path = "vendor/Sanmill/crates/tgf-core" }
tgf-mill = { path = "vendor/Sanmill/crates/tgf-mill" }
tgf-search = { path = "vendor/Sanmill/crates/tgf-search" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
